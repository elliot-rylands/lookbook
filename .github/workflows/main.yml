+import type { ReactNode } from 'react'
+
+export type TabItem = {
+  id: string
+  label: string
+  content: ReactNode
+}
+
+export const defaultItems: TabItem[] = [
+  {
+    id: 'overview',
+    label: 'Overview',
+    content: (
+      <>
+        <h3 className="m-0 text-[17px] font-semibold tracking-[-0.01em]">Tabs that behave like pages</h3>
+        <p className="mt-2 mb-0 text-[14px] leading-6 opacity-70">
+          React Aria supplies the semantics: roving focus, arrow keys, <code>aria-selected</code>. Motion adds
+          three things on top: the indicator slides between tabs, the content cross-fades, and the container
+          eases to the height of whichever panel is active.
+        </p>
+      </>
+    ),
+  },
+  {
+    id: 'work',
+    label: 'Work',
+    content: (
+      <>
+        <h3 className="m-0 text-[17px] font-semibold tracking-[-0.01em]">Selected work</h3>
+        <ul className="m-0 mt-3 list-none p-0">
+          {[
+            ['Practice management, growth', 'Experimentation and CRO across a healthcare SaaS marketing site.'],
+            ['Diagnostic imaging booking', 'End to end booking for MRI and CT scans, from search to referral.'],
+            ['Digital experience platform', 'Design system and accessibility lead for a B2B DXP.'],
+            ['Consumer brands', 'Contract product design across retail, food and automotive.'],
+          ].map(([title, blurb]) => (
+            <li key={title} className="flex flex-col gap-0.5 border-t border-current/10 py-3 first:border-t-0 first:pt-0 last:pb-0">
+              <span className="text-[14px] font-semibold">{title}</span>
+              <span className="text-[13px] opacity-70">{blurb}</span>
+            </li>
+          ))}
+        </ul>
+      </>
+    ),
+  },
+  {
+    id: 'labs',
+    label: 'Labs',
+    content: (
+      <>
+        <h3 className="m-0 text-[17px] font-semibold tracking-[-0.01em]">Labs</h3>
+        <p className="mt-2 mb-0 text-[14px] leading-6 opacity-70">
+          Small, focused prototypes. Each answers one question and is built in code so it can be measured.
+        </p>
+        <div className="mt-4 grid grid-cols-2 gap-2.5">
+          {[
+            ['Seat picker', 'Airline seat selection, reimagined.'],
+            ['Corridor', 'Wildlife alerts for a mountain highway.'],
+            ['Pass', 'Seasonal itineraries for a valley.'],
+            ['These tabs', 'React Aria plus Motion.'],
+          ].map(([title, blurb]) => (
+            <div key={title} className="flex flex-col gap-0.5 rounded-xl border border-current/10 bg-current/[0.04] p-3">
+              <span className="text-[13.5px] font-semibold">{title}</span>
+              <span className="text-[12.5px] opacity-70">{blurb}</span>
+            </div>
+          ))}
+        </div>
+      </>
+    ),
+  },
+  {
+    id: 'contact',
+    label: 'Contact',
+    content: (
+      <>
+        <h3 className="m-0 text-[17px] font-semibold tracking-[-0.01em]">Say hello</h3>
+        <p className="mt-2 mb-0 text-[14px] leading-6 opacity-70">Short on purpose, so you can see the container shrink.</p>
+      </>
+    ),
+  },
+]
