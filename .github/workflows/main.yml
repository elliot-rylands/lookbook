+import { AnimatePresence, LayoutGroup, motion } from 'motion/react'
+import { useId, useState } from 'react'
+import { Tab, TabList, Tabs } from 'react-aria-components'
+
+import { defaultItems, type TabItem } from './items'
+
+type AnimatedTabsProps = {
+  items?: TabItem[]
+  defaultKey?: string
+  /** 'pill' fills the active tab; 'underline' draws a bar beneath it. */
+  indicator?: 'pill' | 'underline'
+  theme?: 'light' | 'dark'
+}
+
+const spring = { type: 'spring', stiffness: 500, damping: 40, mass: 1 } as const
+const fade = { duration: 0.22, ease: [0.32, 0.72, 0, 1] } as const
+
+export default function AnimatedTabs({
+  items = defaultItems,
+  defaultKey,
+  indicator = 'pill',
+  theme = 'light',
+}: AnimatedTabsProps) {
+  const [key, setKey] = useState<string>(defaultKey ?? items[0].id)
+  const groupId = useId()
+  const active = items.find((t) => t.id === key) ?? items[0]
+  const dark = theme === 'dark'
+
+  const surface = dark ? 'bg-[#111114] text-[#f3f3f5]' : 'bg-[#f4f4f5] text-[#111114]'
+  const card = dark ? 'border-white/10 bg-[#17171b]' : 'border-black/[0.08] bg-white'
+  const listBg = dark ? 'border-white/10 bg-[#1f1f25]' : 'border-black/[0.08] bg-[#ececef]'
+  const pill = dark ? 'bg-[#f3f3f5]' : 'bg-[#111114]'
+  const selectedText = indicator === 'pill' ? (dark ? 'text-[#0e0e11]' : 'text-white') : ''
+
+  return (
+    <div className={`flex min-h-[420px] w-full items-start justify-center px-6 py-12 font-[Inter,ui-sans-serif,system-ui,sans-serif] antialiased ${surface}`}>
+      <LayoutGroup id={groupId}>
+        <Tabs
+          selectedKey={key}
+          onSelectionChange={(k) => setKey(String(k))}
+          className="flex w-full max-w-[560px] flex-col gap-3"
+        >
+          <TabList
+            aria-label="Pages"
+            className={
+              indicator === 'pill'
+                ? `flex w-fit max-w-full gap-1 overflow-x-auto rounded-full border p-1 ${listBg}`
+                : `flex w-fit max-w-full gap-1 overflow-x-auto border-b ${dark ? 'border-white/10' : 'border-black/[0.08]'}`
+            }
+          >
+            {items.map((item) => (
+              <Tab
+                key={item.id}
+                id={item.id}
+                className={({ isSelected, isFocusVisible }) =>
+                  [
+                    'relative cursor-pointer select-none whitespace-nowrap text-[14px] font-semibold outline-none transition-colors duration-200',
+                    indicator === 'pill' ? 'rounded-full px-4 py-2' : 'px-3 pt-2 pb-3',
+                    isSelected ? selectedText : 'opacity-60 hover:opacity-100',
+                    isFocusVisible ? 'ring-2 ring-current ring-offset-2 ring-offset-transparent' : '',
+                  ].join(' ')
+                }
+              >
+                {({ isSelected, isPressed }) => (
+                  <>
+                    {isSelected &&
+                      (indicator === 'pill' ? (
+                        <motion.span
+                          layoutId="indicator"
+                          transition={spring}
+                          className={`absolute inset-0 z-0 ${pill}`}
+                          style={{ borderRadius: 999 }}
+                        />
+                      ) : (
+                        <motion.span
+                          layoutId="indicator"
+                          transition={spring}
+                          className={`absolute inset-x-1 -bottom-px z-0 h-0.5 ${pill}`}
+                        />
+                      ))}
+                    <motion.span
+                      className="relative z-10 inline-block"
+                      animate={{ scale: isPressed ? 0.96 : 1 }}
+                      transition={{ type: 'spring', stiffness: 600, damping: 30 }}
+                    >
+                      {item.label}
+                    </motion.span>
+                  </>
+                )}
+              </Tab>
+            ))}
+          </TabList>
+
+          {/* Rendered by hand rather than <TabPanel> so the outgoing panel can play its exit. */}
+          <motion.div
+            layout
+            transition={spring}
+            className={`overflow-hidden border shadow-[0_1px_2px_rgba(0,0,0,0.04),0_12px_32px_rgba(0,0,0,0.06)] ${card}`}
+            style={{ borderRadius: 20 }}
+          >
+            <AnimatePresence mode="popLayout" initial={false}>
+              <motion.section
+                key={active.id}
+                role="tabpanel"
+                className="p-6"
+                initial={{ opacity: 0, y: 8, filter: 'blur(4px)' }}
+                animate={{ opacity: 1, y: 0, filter: 'blur(0px)' }}
+                exit={{ opacity: 0, y: -8, filter: 'blur(4px)' }}
+                transition={fade}
+              >
+                {active.content}
+              </motion.section>
+            </AnimatePresence>
+          </motion.div>
+        </Tabs>
+      </LayoutGroup>
+    </div>
+  )
+}
