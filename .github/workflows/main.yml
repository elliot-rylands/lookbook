+import type { ComponentMetadata } from '@/registry/types'
+
+export const metadata: ComponentMetadata = {
+  title: 'Animated Tabs',
+  slug: 'animated-tabs',
+  category: 'navigation',
+  tags: ['motion', 'tabs', 'navigation', 'layout', 'animation', 'react-aria'],
+  description:
+    'Page-style tabs with a sliding indicator, cross-fading content and a container that eases to the height of the active panel. After Motion’s Base UI tabs example, rebuilt on React Aria.',
+  dateAdded: '2026-09-15',
+  featured: true,
+  notes:
+    'Source: https://motion.dev/examples/react-base-tabs — indicator via layoutId, content via AnimatePresence (popLayout, blur 4px ↔ 0), height via layout on the frame. The example uses Base UI; this study uses react-aria-components (already in the repo) for the same semantics. The panel is rendered by hand instead of <TabPanel> so the exiting content can animate out. Variants: pill (default), underline, dark.',
+}
