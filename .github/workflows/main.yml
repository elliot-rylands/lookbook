Date: Tue, 15 Sep 2026 02:45:56 +0000
Subject: [PATCH] Add Animated Tabs study (Motion + React Aria)

Page-style tabs after motion.dev's Base UI tabs example: sliding indicator
via layoutId, cross-fading panels via AnimatePresence, container height via
layout. Built on react-aria-components (already a dependency) rather than
adding Base UI. Variants: pill, underline, dark.

Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>
